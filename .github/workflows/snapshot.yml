name: Snapshot historique

# Archive un instantané quotidien du pipeline dès que public_data.json change
# sur main (donc à chaque ./update_dashboard.sh que tu pousses), + un filet de
# sécurité quotidien à 20h00 Paris. Génère history/YYYY-MM-DD.json et met à jour
# history/timeseries.json + index.json, puis les commite automatiquement.

on:
  push:
    branches: [main]
    paths:
      - 'public_data.json'      # ne se déclenche que quand la donnée change
  schedule:
    - cron: '0 18 * * *'        # 18h UTC = 20h00 Paris (filet de sécurité)
  workflow_dispatch:

permissions:
  contents: write               # pour commiter le snapshot

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Générer le snapshot du jour
        run: python snapshot.py

      - name: Commit si nouveau snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "Aucun changement d'historique — rien à commiter."
          else
            git commit -m "history: snapshot $(date -u +%Y-%m-%d)"
            git push
            echo "✅ Snapshot archivé."
          fi
