name: Deploy GitHub Pages

# Déploie le dashboard public (demo_dashboard.html + public_data.json + index.html)
# sur GitHub Pages à chaque push sur main. L'index.html redirige vers
# demo_dashboard.html, donc l'URL racine affiche toujours le dashboard à jour.
#
# ⚙️ Activation unique (une seule fois, par le propriétaire du repo) :
#    Settings → Pages → Build and deployment → Source → "GitHub Actions"
# Ensuite ce workflow prend le relais automatiquement.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule exécution à la fois ; on n'annule pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (repo racine)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
