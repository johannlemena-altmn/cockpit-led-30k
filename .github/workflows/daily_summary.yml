name: Résumé quotidien LED

# ─────────────────────────────────────────────────────────────────────────────
# Déclenchement
#   - Automatique : lun.–ven. à 07h00 Europe/Paris (= 05:00 UTC en hiver,
#     06:00 UTC en été — on utilise 05:00 UTC pour être sûr d'arriver avant 07h)
#   - Manuel       : workflow_dispatch (bouton "Run workflow" dans GitHub Actions)
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "0 5 * * 1-5"   # 05:00 UTC lun.–ven. ≈ 07:00 Europe/Paris (heure d'hiver)
  workflow_dispatch:
    inputs:
      export_url:
        description: "URL directe export CSV Pixel (optionnel, sinon secret PIXEL_EXPORT_URL)"
        required: false
        default: ""

permissions:
  contents: write   # nécessaire pour git push public_data.json

jobs:
  generate-summary:
    name: Générer le résumé quotidien
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout du dépôt ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python ─────────────────────────────────────────────────────────
      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Dépendances ────────────────────────────────────────────────────
      - name: Installer les dépendances
        run: pip install pandas openpyxl

      # ── 4a. Pixel CRM via API (recommandé) ───────────────────────────────
      #
      # CONFIGURER CES 2 SECRETS dans Settings > Secrets and variables > Actions :
      #   PIXEL_BASE_URL        = https://votre-instance.pixel-crm.fr
      #   PIXEL_SESSION_COOKIE  = valeur du Cookie copiée depuis DevTools (F12)
      #                           après connexion à Pixel CRM
      #
      # Si les secrets sont présents, pixel_api.py récupère les agrégats directement
      # et écrit public_data.json — le dashboard GitHub Pages se met à jour.
      #
      - name: Récupérer agrégats Pixel CRM (API directe)
        if: env.PIXEL_BASE_URL != '' && env.PIXEL_SESSION_COOKIE != ''
        env:
          PIXEL_BASE_URL: ${{ secrets.PIXEL_BASE_URL }}
          PIXEL_SESSION_COOKIE: ${{ secrets.PIXEL_SESSION_COOKIE }}
        run: |
          echo "Interrogation de l'API Pixel CRM…"
          python pixel_api.py && echo "✅ public_data.json mis à jour depuis l'API Pixel" || echo "⚠️ API Pixel non reconnue — voir logs ci-dessus pour debug"

      # ── 4b. Télécharger l'export CSV (alternative) ───────────────────────
      #
      # Alternative si l'API Pixel n'est pas disponible :
      # Configurer PIXEL_EXPORT_URL avec l'URL directe du CSV (SharePoint, S3, etc.)
      #
      - name: Télécharger l'export CSV Pixel CRM (fallback)
        env:
          PIXEL_EXPORT_URL: ${{ inputs.export_url || secrets.PIXEL_EXPORT_URL }}
        run: |
          mkdir -p data
          if [ -z "$PIXEL_EXPORT_URL" ]; then
            echo "ℹ️  Aucun secret configuré — mode démo."
          else
            echo "Téléchargement CSV depuis PIXEL_EXPORT_URL…"
            curl -L "$PIXEL_EXPORT_URL" --fail --silent --show-error -o data/export_crm.csv
            echo "Export : $(wc -l < data/export_crm.csv) lignes"
          fi

      # ── 5. Générer le résumé HTML ─────────────────────────────────────────
      - name: Générer le résumé quotidien
        run: python daily_summary.py

      # ── 6. Commiter public_data.json (agrégats anonymisés pour GitHub Pages) ──
      - name: Mettre à jour public_data.json
        run: |
          if [ -f public_data.json ]; then
            git config user.email "action@github.com"
            git config user.name "GitHub Actions"
            git add public_data.json
            git diff --cached --quiet || git commit -m "data: public_data.json $(date +%Y-%m-%d)"
            git push
          else
            echo "public_data.json absent — étape ignorée."
          fi

      # ── 7. Upload de l'artifact HTML ──────────────────────────────────────
      #
      # Le HTML est uploadé comme artifact GitHub Actions (disponible 7 jours).
      # Aucune donnée client n'est committée dans le dépôt.
      # Pour consulter : onglet Actions > run > Artifacts > resume-quotidien-YYYYMMDD
      #
      - name: Upload du résumé HTML
        uses: actions/upload-artifact@v4
        with:
          name: resume-quotidien-${{ github.run_id }}
          path: resume_quotidien_*.html
          retention-days: 7
          if-no-files-found: warn

      # ── 8. Notification email ────────────────────────────────────────────
      # Configurer le secret SENDGRID_API_KEY dans Settings → Secrets (gratuit jusqu'à 100 emails/jour)
      - name: Envoyer résumé par email (optionnel)
        if: env.SENDGRID_API_KEY != ''
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python - <<'EOF'
          import os, urllib.request, json, datetime
          key = os.environ['SENDGRID_API_KEY']
          today = datetime.date.today().strftime('%d/%m/%Y')
          run_id = os.environ.get('GITHUB_RUN_ID', '')
          artifact_url = f"https://github.com/johannlemena-altmn/cockpit-led-30k/actions/runs/{run_id}"
          body = {
            "personalizations": [{"to": [{"email": "johann.lemena@gmail.com"}]}],
            "from": {"email": "noreply@cockpit-led.fr", "name": "Cockpit LED"},
            "subject": f"Résumé LED du {today}",
            "content": [{"type": "text/html", "value": f"<p>Bonjour,</p><p>Le résumé quotidien du {today} est disponible :</p><p><a href='{artifact_url}'>Voir le résumé dans GitHub Actions</a></p><p>— Cockpit LED 30k</p>"}]
          }
          req = urllib.request.Request('https://api.sendgrid.com/v3/mail/send',
            data=json.dumps(body).encode(), method='POST',
            headers={'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'})
          urllib.request.urlopen(req)
          print("Email envoyé.")
          EOF

      # ── 9. Résumé dans les logs ───────────────────────────────────────────
      - name: Afficher le résumé dans les logs
        run: |
          echo "──────────────────────────────────────────"
          echo " Résumé quotidien généré avec succès"
          echo " Artifact disponible 7 jours dans Actions"
          echo "──────────────────────────────────────────"
          ls -lh resume_quotidien_*.html 2>/dev/null || echo "(aucun fichier généré)"
